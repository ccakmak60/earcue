<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — earcue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
<link href="assets/earcue.css" rel="stylesheet">
<link href="assets/landing.css" rel="stylesheet">
<style>
  .signin-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .signin-card {
    width: 100%;
    max-width: 22rem;
    border: 1px solid var(--ec-hairline, #2a2a2a);
    border-radius: 0.75rem;
    padding: 2rem;
    text-align: center;
  }
  .signin-card .wordmark { display: block; margin-bottom: 1.5rem; }
  .signin-card input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.65rem 0.75rem;
    margin-bottom: 0.75rem;
    border-radius: 0.5rem;
    border: 1px solid var(--ec-hairline, #2a2a2a);
    background: transparent;
    color: inherit;
    font: inherit;
  }
  .signin-card button {
    width: 100%;
    padding: 0.65rem 0.75rem;
    border-radius: 0.5rem;
    border: none;
    cursor: pointer;
  }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.65rem 0.75rem;
    margin-bottom: 1rem;
    border-radius: 0.5rem;
    border: 1px solid var(--ec-hairline, #2a2a2a);
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .google-btn svg { flex: none; }
  .signin-divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    color: var(--ec-ink-secondary);
    font-size: var(--ec-type-metadata);
  }
  .signin-divider::before,
  .signin-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--ec-hairline, #2a2a2a);
  }
  .signin-error {
    color: #d94f4f;
    font-size: var(--ec-type-metadata);
    margin-top: 0.75rem;
  }
  .signin-note {
    font-size: var(--ec-type-metadata);
    color: var(--ec-ink-secondary);
    margin-top: 1rem;
  }
  .signin-toggle {
    width: auto;
    padding: 0;
    border: none;
    background: none;
    color: inherit;
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="signin-wrap">
    <div class="signin-card" id="card">
      <span class="wordmark">earcue</span>
      <div id="googleAuth" hidden>
        <button type="button" class="google-btn" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62Z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18Z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33Z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58A8.98 8.98 0 0 0 9 0 9 9 0 0 0 .9 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58Z"/>
          </svg>
          Continue with Google
        </button>
        <div class="signin-divider">or</div>
      </div>
      <form id="signinForm">
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        <input type="password" id="password" name="password" placeholder="password" autocomplete="current-password" minlength="8" required />
        <button type="submit" class="btn" id="submitBtn">Sign in</button>
      </form>
      <p class="signin-error" id="error" hidden>Something went wrong. Try again.</p>
      <p class="signin-note" id="note">
        <span id="noteText">New here?</span>
        <button type="button" class="signin-toggle" id="modeToggle">Create an account</button>
      </p>
    </div>
  </div>

  <script type="module">
    const form = document.getElementById("signinForm");
    const errorEl = document.getElementById("error");
    const googleBtn = document.getElementById("googleBtn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const noteText = document.getElementById("noteText");
    const modeToggle = document.getElementById("modeToggle");
    const params = new URLSearchParams(location.search);

    let mode = "signin";

    function applyMode() {
      errorEl.hidden = true;
      if (mode === "signin") {
        submitBtn.textContent = "Sign in";
        passwordInput.autocomplete = "current-password";
        noteText.textContent = "New here?";
        modeToggle.textContent = "Create an account";
      } else {
        submitBtn.textContent = "Create account";
        passwordInput.autocomplete = "new-password";
        noteText.textContent = "Already have an account? Use at least 8 characters.";
        modeToggle.textContent = "Sign in";
      }
    }

    modeToggle.addEventListener("click", () => {
      mode = mode === "signin" ? "signup" : "signin";
      applyMode();
    });

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      try {
        const res = await fetch("/api/auth/sign-in/social", {
          method: "POST",
          credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            provider: "google",
            callbackURL: "/app",
            newUserCallbackURL: "/app?welcome=1",
            errorCallbackURL: "/signin?error=1",
          }),
        });
        if (!res.ok) throw new Error(`sign-in ${res.status}`);
        const { url } = await res.json();
        if (!url) throw new Error("no redirect url");
        location.href = url;
      } catch {
        errorEl.hidden = false;
        googleBtn.disabled = false;
      }
    });

    if (params.get("error")) {
      errorEl.hidden = false;
    }

    fetch("/api/health")
      .then((r) => r.json())
      .then((health) => {
        if (health?.features?.googleAuth) document.getElementById("googleAuth").hidden = false;
      })
      .catch(() => {});

    function errorMessage(code) {
      switch (code) {
        case "INVALID_EMAIL_OR_PASSWORD":
          return "Wrong email or password.";
        case "USER_ALREADY_EXISTS_USE_ANOTHER_EMAIL":
        case "USER_ALREADY_EXISTS":
          return "That email already has an account. Sign in instead.";
        case "PASSWORD_TOO_SHORT":
          return "Use at least 8 characters.";
        case "EMAIL_PASSWORD_SIGN_UP_DISABLED":
          return "Account creation is disabled.";
        default:
          return "Something went wrong. Try again.";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) return;
      errorEl.hidden = true;
      submitBtn.disabled = true;

      try {
        const path = mode === "signin" ? "/api/auth/sign-in/email" : "/api/auth/sign-up/email";
        const body =
          mode === "signin"
            ? { email, password, rememberMe: true }
            : { name: email.split("@")[0], email, password };
        const res = await fetch(path, {
          method: "POST",
          credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        if (res.ok) {
          location.href = "/app";
          return;
        }
        let code;
        try {
          ({ code } = await res.json());
        } catch {
          code = undefined;
        }
        errorEl.textContent = errorMessage(code);
        errorEl.hidden = false;
      } catch {
        errorEl.textContent = errorMessage();
        errorEl.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
