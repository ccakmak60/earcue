<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>earcue context &mdash; settings</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font: inherit; }
  button { margin-top: 20px; padding: 8px 16px; font: inherit; cursor: pointer; }
  #status { margin-top: 12px; font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h1>earcue context</h1>
  <p>Connect this extension to your earcue account so your browsing history and bookmarks feed your personal knowledge base.</p>
  <label for="baseUrl">earcue base URL</label>
  <input type="url" id="baseUrl" placeholder="https://your-earcue-deployment.example" />
  <label for="token">Ingest token</label>
  <input type="text" id="token" placeholder="ec_it_..." />
  <button type="button" id="save">Save</button>
  <div id="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
