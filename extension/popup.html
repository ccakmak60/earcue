<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>earcue context</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; width: 280px; margin: 0; padding: 16px; color: #111; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .row label { font-weight: 500; }
  button { padding: 6px 12px; font: inherit; cursor: pointer; }
  #status { margin-top: 12px; font-size: 12px; color: #555; min-height: 16px; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>earcue context</h1>
  <div class="row">
    <label for="captureToggle">Capture page text</label>
    <input type="checkbox" id="captureToggle" />
  </div>
  <div class="row">
    <button type="button" id="pauseBtn">Pause 1 hour</button>
  </div>
  <div class="row">
    <button type="button" id="neverBtn">Never index this site</button>
  </div>
  <div id="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
