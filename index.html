<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gemini Live Teleprompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
<link href="assets/vercel-brand.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; }

  .app-shell {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--vbg-space-4);
    padding: var(--vbg-space-4) var(--vbg-space-4) 0;
  }
  .app-wordmark {
    display: inline-block;
    width: 74px;
    height: 16px;
    background-color: currentColor;
    -webkit-mask: url("https://py8fhxnkzwtsqdo9.public.blob.vercel-storage.com/p/vercel-wordmark.svg") center / contain no-repeat;
    mask: url("https://py8fhxnkzwtsqdo9.public.blob.vercel-storage.com/p/vercel-wordmark.svg") center / contain no-repeat;
  }
  .app-header-meta {
    font-size: var(--vbg-type-metadata);
    line-height: var(--vbg-leading-caption);
    color: var(--vbg-text-secondary);
  }

  .app-main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: var(--vbg-space-6);
    padding: var(--vbg-space-4);
    max-width: var(--vbg-content-width);
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  /* ---------- settings ---------- */
  #settingsPanel {
    border: 1px solid var(--vbg-border-default);
    border-radius: var(--vbg-radius);
    padding: var(--vbg-space-4);
  }
  #settingsPanel summary {
    cursor: pointer;
    font-size: var(--vbg-type-label);
    font-weight: var(--vbg-weight-semibold);
    color: var(--vbg-text-primary);
    list-style: none;
  }
  #settingsPanel summary::-webkit-details-marker { display: none; }
  .settings {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--vbg-space-4);
    margin-top: var(--vbg-space-4);
  }
  .settings > div:nth-child(3),
  .settings > div:nth-child(4) {
    grid-column: 1 / -1;
  }
  .app-field-label {
    display: block;
    font-size: var(--vbg-type-label);
    color: var(--vbg-text-secondary);
    margin-bottom: var(--vbg-space-1);
  }
  input[type="text"],
  input[type="password"],
  textarea,
  select {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    background: var(--vbg-surface-primary);
    border: 1px solid var(--vbg-border-default);
    border-radius: var(--vbg-radius-small);
    color: var(--vbg-text-primary);
    padding: var(--vbg-space-2) var(--vbg-space-3);
    font-size: var(--vbg-type-compact);
    font-family: var(--vbg-font-sans);
    height: var(--vbg-control-height);
  }
  textarea { resize: vertical; min-height: 60px; height: auto; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--vbg-focus);
    outline-offset: 1px;
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    gap: var(--vbg-space-2);
    flex-wrap: wrap;
  }
  .controls button {
    flex: 1 1 auto;
    min-width: 120px;
    background: var(--vbg-surface-contrast);
    color: var(--vbg-text-on-contrast);
    border: 1px solid var(--vbg-border-on-contrast);
    border-radius: var(--vbg-radius-small);
    padding: var(--vbg-space-3) var(--vbg-space-4);
    font-size: var(--vbg-type-compact);
    font-weight: var(--vbg-weight-medium);
    font-family: var(--vbg-font-sans);
    cursor: pointer;
  }
  .controls button:active { opacity: 0.8; }

  #status {
    text-align: center;
    font-size: var(--vbg-type-metadata);
    color: var(--vbg-text-secondary);
    text-transform: lowercase;
  }

  /* ---------- focal line ---------- */
  #line {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 36vh;
    font-size: clamp(28px, 6vw, 52px);
    line-height: 1.15;
    font-weight: var(--vbg-weight-heading);
    letter-spacing: -0.02em;
    color: var(--vbg-text-primary);
    padding: var(--vbg-space-4);
    text-wrap: balance;
  }

  /* ---------- transcript / history ---------- */
  #room, #past {
    font-size: var(--vbg-type-compact);
    color: var(--vbg-text-secondary);
    max-height: 26vh;
    overflow-y: auto;
    border-top: 1px solid var(--vbg-border-subtle);
    padding-top: var(--vbg-space-2);
  }
  #room { white-space: pre-wrap; opacity: 0.75; }
  #past div {
    padding: var(--vbg-space-1) 0;
    border-bottom: 1px solid var(--vbg-border-subtle);
    color: var(--vbg-text-primary);
    opacity: 0.85;
  }

  .app-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--vbg-space-4);
    padding: var(--vbg-space-4);
    margin-top: var(--vbg-space-8);
  }
  .app-logo {
    display: inline-block;
    width: 16px;
    height: 16px;
    background-color: currentColor;
    -webkit-mask: url("https://py8fhxnkzwtsqdo9.public.blob.vercel-storage.com/p/vercel-logo.svg") center / contain no-repeat;
    mask: url("https://py8fhxnkzwtsqdo9.public.blob.vercel-storage.com/p/vercel-logo.svg") center / contain no-repeat;
  }
  .app-footer-note {
    font-size: var(--vbg-type-metadata);
    color: var(--vbg-text-secondary);
  }

  @media (max-width: 640px) {
    .settings { grid-template-columns: 1fr; }
    .settings > div:nth-child(3),
    .settings > div:nth-child(4) { grid-column: auto; }
  }
</style>
</head>
<body class="vbg-report">
  <a class="vbg-skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="app-header">
      <span class="app-wordmark" role="img" aria-label="Vercel"></span>
      <span class="app-header-meta">Live session &middot; key stays in your browser</span>
    </header>

    <main id="main" class="app-main">
      <details id="settingsPanel" open>
        <summary>Settings</summary>
        <div class="settings">
          <div>
            <label class="app-field-label" for="key">API key</label>
            <input type="password" id="key" placeholder="Gemini API key" />
          </div>
          <div>
            <label class="app-field-label" for="preset">Preset</label>
            <select id="preset">
              <option>Custom</option>
              <option>David Goggins</option>
              <option>Steve Jobs</option>
              <option>Chris Voss (negotiator)</option>
              <option>Casey Neistat</option>
              <option>Warm, funny friend</option>
            </select>
          </div>
          <div>
            <label class="app-field-label" for="persona">Persona</label>
            <input type="text" id="persona" placeholder="Talk like&hellip; (e.g. David Goggins)" />
          </div>
          <div>
            <label class="app-field-label" for="situation">Situation</label>
            <textarea id="situation" placeholder="Who you're talking to and what you want out of it"></textarea>
          </div>
        </div>
      </details>

      <div class="controls">
        <button id="start">Start</button>
        <button id="hold">Hold mic</button>
        <button id="nudge">Give me a line</button>
      </div>

      <div id="status">idle</div>
      <div id="line"></div>
      <div id="room"></div>
      <div id="past"></div>
    </main>

    <footer class="app-footer">
      <span class="app-logo" role="img" aria-label="Vercel"></span>
      <span class="app-footer-note">Gemini Live Teleprompter</span>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
