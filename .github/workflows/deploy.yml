name: Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx opennextjs-cloudflare build
      # --keep-vars so a deploy never wipes vars set in the dashboard; COMMIT_SHA is what
      # /api/health reports as `release`, and the smoke step below asserts it went live.
      - run: npx opennextjs-cloudflare deploy -- --keep-vars --var COMMIT_SHA:${{ github.sha }}
      - run: npx wrangler deploy -c infra/task-consumer/wrangler.jsonc
      - name: Smoke the deployed release
        run: |
          for i in $(seq 1 12); do
            body=$(curl -fsS https://earcue.lol/api/health || true)
            if [ "$(printf '%s' "$body" | jq -r '.release // ""')" = "${{ github.sha }}" ] \
               && [ "$(printf '%s' "$body" | jq -r '.ok // false')" = "true" ]; then
              echo "release ${{ github.sha }} is live"
              exit 0
            fi
            sleep 10
          done
          echo "health never reported ${{ github.sha }}; last body: $body"
          exit 1
