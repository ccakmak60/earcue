name: CI

# Pushes to main and pull requests only: a branch push that also has an open PR used to run twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR cancels the older run. Runs on main never queue behind or cancel
# each other; only the deploy job below is serialized.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Cheapest first, so a lint or type error fails in seconds rather than after the build.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Cloudflare deploy of every commit that lands on main (or a manual run on main, to redeploy).
  # Inert until the repository variable CLOUDFLARE_ACCOUNT_ID is set. It also needs the secrets
  # CLOUDFLARE_API_TOKEN and DATABASE_URL (the production Postgres connection string migrations run
  # against), and, to open the Postgres firewall for the runner, the variables AZURE_CLIENT_ID,
  # AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and AZURE_PG_RESOURCE_GROUP (AZURE_PG_SERVER defaults to
  # earcue-pg). Azure sign-in is OIDC: the app registration needs a federated credential for
  # `repo:ccakmak60/earcue:environment:production`, and a role on the server that can write its
  # firewall rules. Worker runtime secrets are not touched here: they stay in Cloudflare
  # (`wrangler secret bulk`) and `--keep-vars` preserves them.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://earcue.lol
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # azure/login over OIDC
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
      PG_RG: ${{ vars.AZURE_PG_RESOURCE_GROUP }}
      PG_SERVER: ${{ vars.AZURE_PG_SERVER || 'earcue-pg' }}
      PG_RULE: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Schema before code: migrations are append-only, so the running Worker keeps working against
      # the new schema for the seconds until the new one is live.
      # The production Postgres firewall admits only Cloudflare's ranges (for Hyperdrive) and the
      # operator VM, not GitHub's runners, so the runner's IP is let in for this step and taken out
      # again whatever happens.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Open the Postgres firewall for this runner
        run: |
          ip=$(curl -sS --fail https://api.ipify.org)
          echo "runner ip $ip"
          az postgres flexible-server firewall-rule create \
            --resource-group "$PG_RG" --name "$PG_SERVER" \
            --rule-name "$PG_RULE" --start-ip-address "$ip" --end-ip-address "$ip" --output none
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Close the Postgres firewall again
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$PG_RG" --name "$PG_SERVER" --rule-name "$PG_RULE" --yes --output none || true
      - run: npm run deploy
      - run: npx wrangler deploy -c infra/task-consumer/wrangler.jsonc
      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 12); do
            body=$(curl -sS https://earcue.lol/api/health || true)
            if echo "$body" | jq -e --arg sha "$GITHUB_SHA" '.ok == true and .release == $sha' >/dev/null 2>&1; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "health check never reported ok for $GITHUB_SHA: $body"
          exit 1
