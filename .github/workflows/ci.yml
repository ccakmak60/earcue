name: CI

# Pushes to main and pull requests only: a branch push that also has an open PR used to run twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR cancels the older run. Runs on main never queue behind or cancel
# each other; only the deploy job below is serialized.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Cheapest first, so a lint or type error fails in seconds rather than after the build.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Cloudflare deploy of every commit that lands on main. Inert until the repository variable
  # CLOUDFLARE_ACCOUNT_ID is set, alongside the secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit)
  # and DATABASE_URL (the Neon connection string migrations run against). Worker runtime secrets are
  # not touched here: they stay in Cloudflare (`wrangler secret bulk`) and `--keep-vars` preserves them.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://earcue.lol
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Schema before code: migrations are append-only, so the running Worker keeps working against
      # the new schema for the seconds until the new one is live.
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run deploy
      - run: npx wrangler deploy -c infra/task-consumer/wrangler.jsonc
      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 12); do
            body=$(curl -sS https://earcue.lol/api/health || true)
            if echo "$body" | jq -e --arg sha "$GITHUB_SHA" '.ok == true and .release == $sha' >/dev/null 2>&1; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "health check never reported ok for $GITHUB_SHA: $body"
          exit 1
